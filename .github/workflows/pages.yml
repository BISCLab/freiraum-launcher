# Builds the extensions page (designs, wallpaper packs, widget sources) and publishes it with
# GitHub Pages. Needs Pages set to "GitHub Actions" once, under Settings > Pages.
name: Extensions page

on:
  push:
    branches: [master]
    paths:
      - "designs/**"
      - "wallpaper-packs/**"
      - "app/src/main/assets/designs/**"
      - "tools/build_site.py"
      - "visuals/logo_flauncher.svg"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/build_site.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
